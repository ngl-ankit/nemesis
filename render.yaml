# Render Blueprint — one-click deploy: https://render.com/docs/blueprint-spec
#
# Storage decision: managed Postgres via DATABASE_URL (survives deploys and
# restarts, works with >1 gunicorn worker, no single-disk lock-in). See README.
services:
  - type: web
    name: nemesis
    runtime: python
    plan: free
    region: oregon
    rootDir: nemesis
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false            # set in the Render dashboard — never commit it
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SECRET_KEY
        generateValue: true    # Render generates a strong random value
      - key: DATABASE_URL
        fromDatabase:
          name: nemesis-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_ENABLED
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      # - key: CORS_ORIGINS        # only if a separate frontend origin ever calls /api
      #   value: https://example.com

databases:
  - name: nemesis-db
    plan: free
    region: oregon
    databaseName: nemesis
    user: nemesis
