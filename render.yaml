# Render Blueprint — one-click deploy: https://render.com/docs/blueprint-spec
#
# Provisions the Nemesis web service (Flask + Gunicorn, serving the frontend
# from the same origin) and a managed Postgres database. User accounts,
# sessions, settings and achievements live in Postgres so they survive deploys.
#
# AI model: openai/gpt-oss-20b via an OpenAI-compatible endpoint (Groq by default).
services:
  - type: web
    name: nemesis
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: LLM_API_KEY
        sync: false            # set in the Render dashboard — never commit it
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_REASONING_EFFORT
        value: low             # gpt-oss-20b is a reasoning model; keeps spoken replies fast
      - key: SECRET_KEY
        generateValue: true    # signs the session cookie
      - key: SESSION_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: nemesis-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_ENABLED
        value: "false"
      - key: ADMIN_TOKEN
        generateValue: true
      # - key: DISABLE_REGISTRATION   # "true" locks the instance to existing accounts
      #   value: "true"

databases:
  - name: nemesis-db
    plan: free
    region: oregon
    databaseName: nemesis
    user: nemesis
