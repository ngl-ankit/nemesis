<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NEMESIS // ADMIN DIAGNOSTICS</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/icon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}" />
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; position: relative; z-index: 2; }
    .admin-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .admin-head h1 { font-family: "Chakra Petch", sans-serif; letter-spacing: .18em; font-size: 1.1rem; color: var(--a3); margin: 0; }
    .admin-head .meta { font-family: "JetBrains Mono", monospace; font-size: .72rem; color: var(--ink-dim); }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat { padding: 14px 16px; }
    .k { font-family: "JetBrains Mono", monospace; font-size: .62rem; letter-spacing: .2em; color: var(--ink-dim); text-transform: uppercase; }
    .stat .v { font-family: "Chakra Petch", sans-serif; font-size: 1.5rem; color: var(--a3); margin-top: 4px; }
    .stat .v small { font-size: .8rem; color: var(--ink-dim); margin-left: 4px; }
    .events { width: 100%; border-collapse: collapse; font-family: "JetBrains Mono", monospace; font-size: .7rem; }
    .events th, .events td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(var(--a-rgb), .12); vertical-align: top; }
    .events th { color: var(--ink-dim); letter-spacing: .15em; font-weight: 600; font-size: .6rem; text-transform: uppercase; }
    .events td.err { color: var(--a1); }
    .events td.ok { color: #7dffb0; }
    .events td.mono { color: var(--ink); word-break: break-all; }
    .admin-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 16px; }
    .admin-actions input { flex: 1; min-width: 220px; }
    .warn { color: var(--a2); font-family: "JetBrains Mono", monospace; font-size: .7rem; }
    #empty { color: var(--ink-dim); font-family: "JetBrains Mono", monospace; font-size: .75rem; padding: 20px 0; }
  </style>
</head>
<body data-theme="ultron">
  <div class="hex-grid" aria-hidden="true"></div>
  <div class="hud-corner tl" aria-hidden="true"><span class="bracket"></span></div>
  <div class="hud-corner tr" aria-hidden="true"><span class="bracket"></span></div>
  <div class="hud-corner bl" aria-hidden="true"><span class="bracket"></span></div>
  <div class="hud-corner br" aria-hidden="true"><span class="bracket"></span></div>

  <main class="admin-wrap">
    <header class="admin-head">
      <h1>NEMESIS // ADMIN DIAGNOSTICS</h1>
      <div class="meta">build <span id="m-version">{{ version }}</span> · <a href="/" style="color:var(--c1)">← back to HUD</a></div>
    </header>

    <section class="hud-panel admin-actions" aria-label="Admin token">
      <label for="tok" class="warn">X-Admin-Token</label>
      <input id="tok" type="password" autocomplete="off" placeholder="paste ADMIN_TOKEN" />
      <button id="load" class="btn primary" type="button">LOAD</button>
      <button id="auto" class="btn ghost mono" type="button" aria-pressed="false">AUTO: OFF</button>
      <span id="err" class="warn" role="status"></span>
    </section>

    <section class="admin-grid" aria-label="Summary">
      <div class="hud-panel stat"><div class="k">Model</div><div class="v" id="s-model">—</div></div>
      <div class="hud-panel stat"><div class="k">Database</div><div class="v" id="s-db">—</div></div>
      <div class="hud-panel stat"><div class="k">Environment</div><div class="v" id="s-env">—</div></div>
      <div class="hud-panel stat"><div class="k">Debate p50</div><div class="v" id="s-p50">—<small>ms</small></div></div>
      <div class="hud-panel stat"><div class="k">Debate p95</div><div class="v" id="s-p95">—<small>ms</small></div></div>
      <div class="hud-panel stat"><div class="k">Error rate</div><div class="v" id="s-err">—<small>%</small></div></div>
    </section>

    <section class="hud-panel" style="padding:14px 16px" aria-label="Recent events">
      <div class="k" style="margin-bottom:8px">Recent events (latest 100)</div>
      <div style="overflow:auto">
        <table class="events" id="events">
          <thead><tr><th>Time</th><th>Level</th><th>Kind</th><th>Model</th><th>Latency</th><th>Request</th><th>Message</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="empty">No data loaded. Enter the admin token and press Load.</div>
    </section>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const tok = $("tok"), err = $("err");
      let timer = null;
      const saved = sessionStorage.getItem("nemesis.adminToken");
      if (saved) tok.value = saved;
      const qs = new URLSearchParams(location.search);
      if (qs.get("token")) { tok.value = qs.get("token"); history.replaceState(null, "", "/admin"); }
      const fmt = (v, d = 0) => (v == null ? "—" : Number(v).toFixed(d));

      async function load() {
        err.textContent = "";
        const t = tok.value.trim();
        if (!t) { err.textContent = "token required"; return; }
        sessionStorage.setItem("nemesis.adminToken", t);
        let res;
        try { res = await fetch("/api/admin/diagnostics", { headers: { "X-Admin-Token": t }, cache: "no-store" }); }
        catch (e) { err.textContent = "network error"; return; }
        if (!res.ok) { err.textContent = res.status === 403 ? "forbidden — bad token" : `HTTP ${res.status}`; return; }
        const d = await res.json();
        $("s-model").textContent = d.model || "—";
        $("s-db").textContent = d.db || "—";
        $("s-env").textContent = d.env || "—";
        $("m-version").textContent = d.version || "";
        const lat = d.latency || {};
        const deb = lat.debate || lat.debate_stream || Object.values(lat)[0] || {};
        $("s-p50").firstChild.textContent = fmt(deb.p50_ms);
        $("s-p95").firstChild.textContent = fmt(deb.p95_ms);
        const evs = d.events || [];
        const errors = evs.filter((e) => (e.level || "").toLowerCase() === "error").length;
        $("s-err").firstChild.textContent = evs.length ? fmt((errors / evs.length) * 100, 1) : "0";

        const tb = $("events").querySelector("tbody");
        tb.innerHTML = "";
        $("empty").style.display = evs.length ? "none" : "";
        for (const e of evs) {
          const tr = document.createElement("tr");
          const isErr = (e.level || "").toLowerCase() === "error";
          const cells = [
            [e.created_at || "", "mono"],
            [(e.level || "").toUpperCase(), isErr ? "err" : "ok"],
            [e.kind || "", ""],
            [e.model || "", "mono"],
            [e.latency_ms != null ? `${e.latency_ms} ms` : "", ""],
            [e.request_id || "", "mono"],
            [e.message || "", isErr ? "err" : ""],
          ];
          for (const [txt, cls] of cells) {
            const td = document.createElement("td");
            td.textContent = txt;
            if (cls) td.className = cls;
            tr.appendChild(td);
          }
          tb.appendChild(tr);
        }
      }

      $("load").addEventListener("click", load);
      tok.addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
      $("auto").addEventListener("click", function () {
        if (timer) { clearInterval(timer); timer = null; this.textContent = "AUTO: OFF"; this.setAttribute("aria-pressed", "false"); }
        else { timer = setInterval(load, 10000); this.textContent = "AUTO: 10S"; this.setAttribute("aria-pressed", "true"); load(); }
      });
      if (tok.value) load();
    })();
  </script>
</body>
</html>
